services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
    command: >
      postgres -c shared_buffers=96MB -c max_connections=40
               -c work_mem=4MB -c maintenance_work_mem=48MB
               -c effective_cache_size=192MB
    shm_size: 128mb
    ports:
      - "5432:5432"
    volumes:
      - onboarding-pg-data:/var/lib/postgresql/data
    mem_limit: 320m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru --save ""
    sysctls:
      - net.core.somaxconn=1024
    ports:
      - "6379:6379"
    mem_limit: 80m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 448m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  onboarding-pg-data: