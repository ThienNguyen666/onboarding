spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: onboarding

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/onboarding
    username: onboarding
    password: onboarding
    driver-class-name: org.postgresql.Driver
    connection-fetch: lazy
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

app:
  onboarding:
    cors:
      # Mặc định KHÔNG bật CORS (an toàn) — profile dev sẽ mở "*", profile prod bắt buộc set rõ domain.
      allowed-origins: ${ALLOWED_ORIGINS:}
    retry:
      default-max-ocr-retries: 3
      default-max-liveness-retries: 3
      default-max-nfc-retries: 3
    otp:
      length: 6
      ttl-seconds: 300
      max-verify-attempts: 5
      # Mặc định TẮT — profile dev bật lại. Không để lộ debug endpoint ra ngoài ý muốn.
      debug-endpoint-enabled: false
    dropoff:
      ttl-hours: 24
    ekyc-mock:
      always-pass-by-default: true
    compliance-mock:
      strategy: RULE_BASED

conductor:
  server:
    url: ${CONDUCTOR_SERVER_URL:https://developer.orkescloud.com/api}
    auth-key: ${CONDUCTOR_AUTH_KEY:}
    auth-secret: ${CONDUCTOR_AUTH_SECRET:}
  worker:
    auto-start: ${CONDUCTOR_WORKER_AUTO_START:true}
    thread-count: ${CONDUCTOR_WORKER_THREAD_COUNT:10}
    polling-interval-ms: ${CONDUCTOR_WORKER_POLLING_INTERVAL_MS:1000}
  workflow:
    name: vendor_sdk_ekyc_account_opening
    version: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
    min-response-size: 1024

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs