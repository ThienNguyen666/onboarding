spring:
  application:
    name: onboarding

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/onboarding
    username: onboarding
    password: onboarding
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

app:
  onboarding:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:*}
    otp:
      length: 6
      ttl-seconds: 300
      max-verify-attempts: 5
      debug-endpoint-enabled: true
    dropoff:
      ttl-hours: 24
    ekyc-mock:
      always-pass-by-default: true
    compliance-mock:
      strategy: RULE_BASED

logging:
  level:
    "[com.bank.onboarding]": DEBUG

conductor:
  server:
    url: ${CONDUCTOR_SERVER_URL:}
    auth-key: ${CONDUCTOR_AUTH_KEY:}
    auth-secret: ${CONDUCTOR_AUTH_SECRET:}
  worker:
    auto-start: ${CONDUCTOR_WORKER_AUTO_START:true}
  workflow:
    name: vendor_sdk_ekyc_account_opening
    version: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful